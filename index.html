<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>英単語テスト - 鉄壁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

  body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
      color: #f8fafc;
      width: 100%;
      min-height: 100vh; /* 👈 最低の高さを100vhにし、コンテンツが増えたら伸びるようにする */
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* 👈 上から順に配置する */
      align-items: flex-start;
      background-color: #121824;
      overflow-y: auto; /* 👈 縦スクロール（スワイプ）を許可する */
      position: relative;
    }
    
    .header-area {
      text-align: left;
      margin-top: 5px;
      width: 100%;
      max-width: 2000px;
      padding-left: 160px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .title-group {
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s ease;
    }

    .title-group:hover {
      opacity: 0.8;
    }

    .title-group h2 {
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 4px 0;
      letter-spacing: -0.5px;
    }
　　　    .title-group h3 {
      font-size: 26px;
      font-weight: 800;
      color: #ff0000;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .progress-badge {
      font-size: 18px;
      font-weight: 800;
      color: #60a5fa;
      background: #1e293b;
      border: 2px solid #334155;
      padding: 8px 16px;
      border-radius: 12px;
      letter-spacing: 1px;
    }

    .change-sec-btn {
      background: #1e293b;
      color: #60a5fa;
      border: 2px solid #334155;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .change-sec-btn:hover {
      background: #334155;
      border-color: #3b82f6;
    }

    .full-line {
      border: none;
      height: 5px;
      background-color: #002fd0;
      width: 100%;
      margin: 0;
    }

 .main-content {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex-grow: 1;
      padding-top: 40px;  
      padding-left: 40px;  /* 👈 カード一覧とタイトルのスタート位置をここに統一 */
      padding-right: 40px;
      box-sizing: border-box;
    }
    .header, h1, .logo-title {
      margin-left: 0 !important;   /* 不要な左マージンを解除 */
      padding-left: 0 !important;  /* 不要なパディングを解除 */
      text-align: left;            /* 左揃え */
    }
       .selection-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .selection-title {
      font-size: 24px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 24px;
    }
 .section-grid {
      display: grid;
      /* 👈 通常は5列、画面が狭くなったら自動で1行の列数を減らす設定 */
      grid-template-columns: repeat(auto-fit, minmax(calc((100% - 48px) / 5), 1fr));
      gap: 12px;
      width: 100%;
    }
        
   .section-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px; /* 👈 角の丸みを少し小さく */
      padding: 12px 16px; /* 👈 内側の余白をスリムにする */
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px; /* 👈 タイトルと情報の隙間を狭く */
    }
    .section-card:hover {
      border-color: #3b82f6;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      background: #24334a;
    }

  .section-card .sec-name {
      font-size: 18px; /* 👈 文字サイズを少し小さくすっきりさせる */
      font-weight: 800;
      color: #60a5fa;
    }

    .section-card .sec-info {
      font-size: 12px; /* 👈 文字サイズを小さくする */
      color: #94a3b8;
    }
    .quiz-screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: flex-start;
    }

    .japanese {
      font-size: clamp(20px, 3.5vw, 30px);
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 32px;
      line-height: 1.4;
      text-align: left;
      padding: 0;
      max-width: 100%;
    }

    .char-inputs-container {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
      flex-wrap: nowrap;
      width: 100%;
      box-sizing: border-box;
      overflow-x: auto;
    }

    .char-input {
      width: 48px;
      height: 60px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      background-color: #1e293b;
      color: #ffffff;
      border: 2px solid #334155;
      border-radius: 10px;
      outline: none;
      font-family: 'Plus Jakarta Sans', monospace;
      transition: all 0.15s ease;
      flex-shrink: 0;
      text-transform: lowercase;
    }

    .char-input.fixed {
      background-color: #1a2234;
      color: #93c5fd;
      border-color: #273548;
    }

    .char-input:focus {
      border-color: #3b82f6;
      background-color: #0f172a;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    .char-input:read-only {
      background-color: #1a2234;
      color: #64748b;
      border-color: #273548;
    }

    #quizForm {
      width: 100%;
    }

    .submit-btn {
      font-size: 18px;
      font-weight: 700;
      padding: 16px 28px;
      width: 320px;
      max-width: 100%;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }

    .finish-screen-box {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
    }

    .finish-title {
      font-size: 28px;
      font-weight: 800;
      color: #34d399;
    }

    .finish-score {
      font-size: 22px;
      font-weight: 700;
      color: #cbd5e1;
    }

    .back-to-list-btn {
      font-size: 18px;
      font-weight: 700;
      padding: 16px 28px;
      width: 320px;
      max-width: 100%;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .back-to-list-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
    }

    .footer-space {
      height: 10px;
    }

    .result-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 15, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .result-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      background: #121824;
      border: 2px solid #334155;
      width: 90%;
      max-width: 480px;
      padding: 44px 36px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .result-modal.show .result-card {
      transform: scale(1);
    }

    .result-icon {
      font-size: 68px;
      margin-bottom: 16px;
      line-height: 1;
    }

    .result-title {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .result-card.correct-card .result-title {
      color: #34d399;
    }

    .result-card.incorrect-card .result-title {
      color: #fb7185;
    }

    .word-reveal {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 26px;
    }

    .word-reveal .label {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .word-reveal .correct-word {
      font-size: 30px;
      font-weight: 800;
      color: #60a5fa;
      font-family: 'Plus Jakarta Sans', monospace;
      letter-spacing: 1px;
    }

    .next-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      font-size: 18px;
      font-weight: 700;
      padding: 16px 28px;
      width: 100%;
      border: none;
      border-radius: 16px;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
    }

    .next-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      transform: translateY(-2px);
    }

    .next-btn:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <div class="header-area">
    <div class="title-group" onclick="showSectionSelection()" title="最初の画面に戻る">
      <h2>東大英単語熟語</h2>
      <h3>鉄壁</h3>
    </div>
    
    <div class="header-controls">
      <div class="progress-badge" id="progressBadge" style="display: none;">0 / 0</div>
      <button class="change-sec-btn" id="changeSecBtn" onclick="showSectionSelection()" style="display: none;">
        ⚙ Sectionを変更する
      </button>
    </div>
  </div>
  <hr class="full-line">

  <div class="main-content">
    <div class="selection-screen" id="selectionScreen">
      <div class="selection-title">学習する Section を選択してください</div>
      <div class="section-grid" id="sectionGrid"></div>
    </div>

    <div class="quiz-screen" id="quizScreen">
      <div class="japanese" id="japaneseWord">日本語意味</div>

      <form id="quizForm" onsubmit="handleFormAction(event)">
        <div class="char-inputs-container" id="charInputsContainer"></div>
        <button type="submit" class="submit-btn" id="actionBtn">回答する</button>
      </form>

      <div class="finish-screen-box" id="finishScreenBox">
        <div class="finish-title">🎉 セクション終了！お疲れ様でした！</div>
        <div class="finish-score" id="finishScoreText">正解数: 0 / 0</div>
        <button type="button" class="back-to-list-btn" onclick="showSectionSelection()">セクション一覧へ戻る</button>
      </div>
    </div>
  </div>

  <div class="footer-space"></div>
  
  <div class="result-modal" id="resultModal">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon">🎉</div>
      <div class="result-title" id="resultTitle">正解！</div>
      
      <div class="word-reveal">
        <div class="label">正解の英単語</div>
        <div class="correct-word" id="modalCorrectWord">essential</div>
      </div>

      <button type="button" class="next-btn" id="nextBtn" onclick="goToNextWord()">次の単語へ ➔</button>
    </div>
  </div>

  <!-- 👇 ここで data.js を読み込んでからプログラムを動かします -->
  <script src="data.js"></script>
  <script>
    let currentSection = null;
    let currentSectionWords = [];
    let currentIndex = 0;
    let correctCount = 0;

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function toHalfWidth(str) {
      return str.replace(/[Ａ-Ｚａ-ｚ]/g, (s) => {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
    }

    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gainNode.gain.setValueAtTime(0.15, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.setValueAtTime(120, now + 0.15);
          gainNode.gain.setValueAtTime(0.2, now);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {
        console.log("Audio not supported or blocked");
      }
    }

    function renderSectionSelection() {
      const grid = document.getElementById("sectionGrid");
      grid.innerHTML = "";

      sectionData.forEach((sec, idx) => {
        const card = document.createElement("div");
        card.className = "section-card";
        card.onclick = () => startQuiz(idx);

        card.innerHTML = `
          <div class="sec-name">${sec.sectionTitle}</div>
          <div class="sec-info">全 ${sec.words.length} 語 (ランダム)</div>
        `;

        grid.appendChild(card);
      });
    }

    function showSectionSelection() {
      const modal = document.getElementById("resultModal");
      if (modal) modal.classList.remove("show");

      document.getElementById("selectionScreen").style.display = "flex";
      document.getElementById("quizScreen").style.display = "none";
      document.getElementById("changeSecBtn").style.display = "none";
      document.getElementById("progressBadge").style.display = "none";
    }

    function startQuiz(sectionIndex) {
      currentSection = sectionData[sectionIndex];
      currentSectionWords = shuffleArray(currentSection.words);
      currentIndex = 0;
      correctCount = 0;

      document.getElementById("quizForm").style.display = "block";
      document.getElementById("finishScreenBox").style.display = "none";

      document.getElementById("selectionScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "flex";
      document.getElementById("changeSecBtn").style.display = "block";
      document.getElementById("progressBadge").style.display = "block";

      showQuestion();
    }

    function showQuestion() {
      const currentWord = currentSectionWords[currentIndex];

      document.getElementById("japaneseWord").textContent = currentWord.japanese;
      document.getElementById("progressBadge").textContent = `${currentIndex + 1} / ${currentSectionWords.length}`;

      const wordLength = currentWord.english.length;
      const firstLetter = currentWord.english.charAt(0).toLowerCase();
      
      const container = document.getElementById("charInputsContainer");
      container.innerHTML = "";

      for (let i = 0; i < wordLength; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 1;
        input.className = "char-input";
        input.dataset.index = i;

        const char = currentWord.english.charAt(i).toLowerCase();

        if (i === 0) {
          input.value = firstLetter;
          input.readOnly = true;
          input.classList.add("fixed");
        } else if (char === " " || char === "-") {
          input.value = char;
          input.readOnly = true;
          input.classList.add("fixed");
        } else {
          input.placeholder = "_";

          input.addEventListener("input", (e) => {
            let val = toHalfWidth(e.target.value).toLowerCase();
            val = val.replace(/[^a-z]/g, "");
            e.target.value = val;

            if (val.length === 1) {
              let nextIdx = i + 1;
              let nextInput = container.querySelector(`[data-index="${nextIdx}"]`);
              while (nextInput && nextInput.readOnly) {
                nextIdx++;
                nextInput = container.querySelector(`[data-index="${nextIdx}"]`);
              }
              if (nextInput) {
                nextInput.focus();
              }
            }
          });

          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "") {
              let prevIdx = i - 1;
              let prevInput = container.querySelector(`[data-index="${prevIdx}"]`);
              while (prevInput && prevInput.readOnly && prevIdx > 0) {
                prevIdx--;
                prevInput = container.querySelector(`[data-index="${prevIdx}"]`);
              }
              if (prevInput && !prevInput.readOnly) {
                prevInput.focus();
                prevInput.value = "";
                e.preventDefault();
              }
            }
          });
        }
        container.appendChild(input);
      }
      
      document.getElementById("actionBtn").textContent = "回答する";

      const firstEditable = container.querySelector('.char-input:not(.fixed)');
      if (firstEditable) {
        firstEditable.focus();
      }
    }

    function handleFormAction(event) {
      event.preventDefault();

      const container = document.getElementById("charInputsContainer");
      const inputs = container.querySelectorAll(".char-input");

      let userInput = "";
      inputs.forEach(input => {
        userInput += toHalfWidth(input.value).toLowerCase();
      });

      const target = currentSectionWords[currentIndex].english.toLowerCase();
      const isCorrect = (userInput === target);

      if (isCorrect) {
        playSound('correct');
        correctCount++;
      } else {
        playSound('incorrect');
      }

      const modal = document.getElementById("resultModal");
      const card = document.getElementById("resultCard");
      const icon = document.getElementById("resultIcon");
      const title = document.getElementById("resultTitle");
      const modalWord = document.getElementById("modalCorrectWord");

      modalWord.textContent = currentSectionWords[currentIndex].english;

      if (isCorrect) {
        card.className = "result-card correct-card";
        icon.textContent = "🎉";
        title.textContent = "正解！";
      } else {
        card.className = "result-card incorrect-card";
        icon.textContent = "😢";
        title.textContent = "不正解...";
      }

      modal.classList.add("show");
      document.getElementById("nextBtn").focus();
    }

    function goToNextWord() {
      const modal = document.getElementById("resultModal");
      modal.classList.remove("show");

      currentIndex++;
      if (currentIndex < currentSectionWords.length) {
        showQuestion();
      } else {
        document.getElementById("japaneseWord").textContent = "";
        document.getElementById("charInputsContainer").innerHTML = "";
        document.getElementById("quizForm").style.display = "none";
        
        document.getElementById("finishScoreText").textContent = `正解数: ${correctCount} / ${currentSectionWords.length}`;
        document.getElementById("finishScreenBox").style.display = "flex";
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const modal = document.getElementById("resultModal");
        if (modal.classList.contains("show")) {
          e.preventDefault();
          goToNextWord();
        }
      }
    });

    renderSectionSelection();
  </script>
</body>
</html>
